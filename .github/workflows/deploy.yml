name: Deploy Portfolio to Hostiman

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portfolio-development-memory-system

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-development-memory-system/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Hostiman FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:

          server: ${{ secrets.FTP_HOST }}

          username: ${{ secrets.FTP_USER }}

          password: ${{ secrets.FTP_PASSWORD }}

          server-dir: ${{ secrets.FTP_PATH }}/

          local-dir: portfolio-development-memory-system/dist/
        run: ls -la dist
